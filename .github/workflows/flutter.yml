name: Flutter checks

on:
  push:
    branches: [main]
    paths: ['front/**', '.github/workflows/flutter.yml']
  pull_request:
    branches: [main]
    paths: ['front/**', '.github/workflows/flutter.yml']

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Run browser tests
        run: flutter test --platform chrome test/token_storage_web_test.dart
      - name: Build web
        run: flutter build web --release --dart-define=API_URL=https://example.invalid/api/v1
