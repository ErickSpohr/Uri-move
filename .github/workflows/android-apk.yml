name: Android APK

# Gera o APK apontando para a API de produção e publica na release "apk".
on:
  push:
    branches: [main]
    paths: ['front/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_URL=https://uri-move-api-rjwm.onrender.com/api/v1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk uri-move.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "URI Move (Android)" --notes "APK gerado automaticamente a cada atualização do app."
          gh release upload apk uri-move.apk --clobber
