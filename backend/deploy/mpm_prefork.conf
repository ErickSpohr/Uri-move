# Poucos processos: cada um mantém uma conexão persistente com o Supabase
# (Session pooler do plano gratuito aceita poucas conexões simultâneas).
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       6
    MaxConnectionsPerChild  1000
</IfModule>
